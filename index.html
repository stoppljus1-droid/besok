header{display:flex;align-items:center;gap:14px;padding:14px 20px;margin:20px 28px 0;background:var(--cardt);border-radius:16px;align-self:flex-start}
header b{font-weight:500;font-size:18px;display:block}
header span{color:var(--tx2);font-size:14px}
main{flex:1;display:flex;padding:16px 28px;overflow:auto}
.wrap{width:100%;max-width:980px;margin:auto;background:var(--cardt);border-radius:24px;padding:52px}
h1{font-size:46px;font-weight:600;line-height:1.15;margin:0 0 12px}
p.sub{color:var(--tx2);font-size:26px;line-height:1.35;margin:0 0 36px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.big{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:64px 20px;font:inherit;color:var(--tx);font-size:40px;font-weight:600;cursor:pointer;text-align:center}
.big.p{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.big small{display:block;font-size:22px;font-weight:400;margin-top:10px;color:var(--tx2)}
.big:active{transform:scale(.98)}
input[type=text],input[type=password]{width:100%;font:inherit;font-size:34px;padding:24px 26px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
input:focus{outline:2px solid var(--ac)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:30px 20px;font:inherit;font-size:30px;font-weight:500;color:var(--tx);cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.btn{font:inherit;font-size:26px;font-weight:500;padding:20px 38px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
.btn.p{background:var(--ac);color:var(--on);border-color:var(--ac)}
.step{color:var(--tx2);font-size:22px;margin-bottom:10px}
.warn{background:#FAEEDA;color:#633806;border:1px solid #EF9F27;border-radius:14px;padding:18px 22px;font-size:22px;font-weight:500;margin:0 0 20px}@media(prefers-color-scheme:dark){.warn{background:#633806;color:#FAC775;border-color:#BA7517}}.last{color:var(--tx2);font-size:20px;margin:0 0 20px}
@media(prefers-color-scheme:dark){.sig{filter:brightness(0) invert(.92)}}
.err{color:#A32D2D;font-size:22px;font-weight:500;min-height:30px;margin-top:8px}
.list{display:grid;gap:14px}
.item{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px 26px;font:inherit;font-size:30px;font-weight:500;color:var(--tx);text-align:left;width:100%}
.item small{color:var(--tx2);font-size:21px;font-weight:400;margin-top:4px;display:block}
.ok{text-align:center}
.ok .tick{width:120px;height:120px;border-radius:50%;background:var(--acbg);color:var(--ac);font-size:68px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}
footer{padding:14px 22px;margin:0 28px 20px;background:var(--cardt);border-radius:14px;color:var(--tx2);font-size:18px;display:flex;justify-content:space-between;gap:12px}
footer a{color:var(--tx2);cursor:pointer;text-decoration:underline}

.welcome{display:flex;align-items:center;gap:28px;margin-bottom:36px}.welcome .sig{width:140px;height:140px;object-fit:contain;flex:none}.welcome h1{margin-bottom:14px}.welcome .sub{margin-bottom:0}
.staff-out{display:block;margin-top:10px;font-size:20px;padding:12px 18px}input{scroll-margin:20px}button:focus-visible,a:focus-visible{outline:3px solid var(--ac);outline-offset:4px}
@media(max-width:820px){main{padding:16px}.wrap{padding:32px;max-width:100%}h1{font-size:36px}.welcome{gap:20px}.welcome .sig{width:110px;height:110px}.big{font-size:32px;padding:44px 16px}.btn{font-size:22px;padding:16px 24px}p.sub{font-size:23px}footer{margin:0 16px 16px;flex-wrap:wrap}.item{font-size:24px;gap:16px}.item small{font-size:18px}}
@media(max-width:540px),(max-height:540px){.wrap{padding:24px}h1{font-size:30px}.welcome .sig{width:80px;height:80px}.welcome{gap:16px;margin-bottom:24px}.big{padding:28px 12px;font-size:26px}p.sub{font-size:20px;margin-bottom:20px}input[type=text],input[type=password]{font-size:26px;padding:16px}.btn{font-size:20px;padding:14px 18px}.item{flex-wrap:wrap;font-size:22px}footer{font-size:15px}}

/* Refined typography and touch controls */
body{font-family:ui-rounded,"SF Pro Rounded","Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1{font-weight:650;letter-spacing:-.035em;line-height:1.16;text-wrap:balance}
p.sub{font-weight:400;letter-spacing:-.012em;line-height:1.45}
.step{font-size:18px;font-weight:600;letter-spacing:.04em}
.wrap{border:1px solid rgba(255,255,255,.45);box-shadow:0 18px 60px rgba(20,35,50,.10)}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .18s ease,box-shadow .18s ease,transform .12s ease}
.big{border:1px solid rgba(24,95,165,.12);border-radius:24px;background:linear-gradient(160deg,#fff,#f0f4f8);color:#26415b;font-weight:650;letter-spacing:-.025em;box-shadow:0 6px 18px rgba(24,55,85,.07),inset 0 1px 0 rgba(255,255,255,.8)}
.big.p{background:linear-gradient(145deg,#287bc0,#185fa5);color:#fff;border-color:rgba(20,70,120,.12);box-shadow:0 10px 25px rgba(24,95,165,.20),inset 0 1px 0 rgba(255,255,255,.22)}
.big::before{display:flex;align-items:center;justify-content:center;width:50px;height:50px;margin:0 auto 18px;border-radius:16px;background:rgba(24,95,165,.08);font-size:30px;line-height:1;font-weight:400}
.big.p::before{content:"↪";background:rgba(255,255,255,.16)}
.big:not(.p)::before{content:"↗"}
.btn{border-radius:17px;border-color:rgba(90,110,130,.18);background:linear-gradient(160deg,#fff,#f4f6f8);color:#334b60;font-weight:600;letter-spacing:-.012em;box-shadow:0 3px 10px rgba(25,45,65,.04)}
.btn.p{background:linear-gradient(145deg,#287bc0,#185fa5);color:#fff;border-color:transparent;box-shadow:0 5px 14px rgba(24,95,165,.17)}
.btn:active,.item:active{transform:scale(.985)}
.big:active{transform:scale(.975);box-shadow:0 3px 10px rgba(24,55,85,.08)}
input[type=text],input[type=password]{border-radius:18px;border-color:#d8e0e7;box-shadow:inset 0 2px 5px rgba(25,45,65,.025);font-weight:450;letter-spacing:-.015em}
input:focus{outline:3px solid rgba(40,123,192,.22);border-color:#287bc0;outline-offset:2px}
.item{border-radius:18px;font-weight:600;letter-spacing:-.012em}.item small{letter-spacing:0;line-height:1.4}.staff-out{border-radius:12px}
footer{font-size:16px;line-height:1.45}
@media(hover:hover){.big:hover,.btn:hover{transform:translateY(-2px);box-shadow:0 9px 24px rgba(24,55,85,.14)}button.item:hover{background:var(--acbg)}}
@media(prefers-color-scheme:dark){.wrap{border-color:rgba(255,255,255,.06)}.big,.btn{background:linear-gradient(155deg,#343a40,#2a3036);color:#e4edf6;border-color:#485460;box-shadow:0 6px 18px rgba(0,0,0,.13)}.big.p,.btn.p{background:linear-gradient(145deg,#357fba,#226399);color:#fff;border-color:rgba(255,255,255,.10)}.big::before{background:rgba(133,183,235,.12)}input[type=text],input[type=password]{border-color:#485460}}
@media(max-height:540px){.big::before{width:36px;height:36px;border-radius:12px;font-size:24px;margin-bottom:10px}}
@media(prefers-reduced-motion:reduce){button{transition:none}.big:hover,.btn:hover,.big:active,.btn:active,.item:active{transform:none}}


/* Original theme with horizontal landscape controls */
html,body{min-height:100%;height:100dvh}
main{min-height:0;padding:20px 32px}
.wrap{width:100%;max-width:1100px;padding:40px 48px;border-radius:24px}
.welcome{gap:28px;margin-bottom:32px}.welcome .sig{width:116px;height:116px}.welcome h1{font-size:42px}.welcome .sub{font-size:23px}
.two{gap:22px}.big{display:flex;align-items:center;justify-content:center;gap:20px;min-height:114px;padding:30px 28px;border-radius:18px;font-size:34px;line-height:1.2}
.big::before{display:flex;flex:0 0 48px;align-items:center;justify-content:center;width:48px;height:48px;margin:0;border-radius:14px;font-size:29px}
.btn{border-radius:14px}.item{border-radius:16px;padding:20px 24px}input[type=text],input[type=password]{border-radius:16px;padding:20px 24px}
footer{margin:0 32px 16px;padding:12px 20px}
@media(orientation:landscape) and (max-height:700px){main{padding:12px 28px}.wrap{padding:28px 36px}.welcome{margin-bottom:24px}.welcome .sig{width:90px;height:90px}.welcome h1{font-size:36px}.big{min-height:96px;padding:24px;font-size:30px;gap:18px}.big::before{flex-basis:42px;width:42px;height:42px;margin:0;font-size:26px}h1{font-size:34px}p.sub{font-size:22px;margin-bottom:22px}input[type=text],input[type=password]{font-size:28px;padding:16px 22px}.btn{font-size:22px;padding:15px 24px}footer{font-size:14px;margin-bottom:10px}}
@media(max-width:600px){main{padding:16px}.wrap{padding:24px}.welcome .sig{width:80px;height:80px}.welcome h1{font-size:30px}.big{font-size:24px;padding:22px 14px;gap:12px;min-height:88px}.big::before{flex-basis:34px;width:34px;height:34px;margin:0;font-size:23px}footer{margin:0 16px 12px}.two{gap:14px}}


.purpose-options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:22px}.purpose-choice{min-height:68px;padding:18px 16px;font-size:24px}.employer-label{display:block;font-size:22px;font-weight:600;margin-bottom:10px}#employer-field{margin-top:18px}#employer-field[hidden]{display:none}
@media(orientation:landscape) and (max-height:700px){.purpose-choice{min-height:56px;padding:14px;font-size:22px}.purpose-options{margin-bottom:16px;gap:12px}.employer-label{font-size:20px;margin-bottom:8px}}
@media(max-width:600px){.purpose-options{grid-template-columns:repeat(2,minmax(0,1fr))}.purpose-choice{font-size:20px}}


/* New font pairing: rounded headings and clean readable body text. */
body{font-family:"Avenir Next",Avenir,"Trebuchet MS","Segoe UI",sans-serif;font-weight:400;letter-spacing:0}
h1,.welcome h1{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:700;letter-spacing:-.025em;line-height:1.2}
button,.big,.btn,.purpose-choice{font-family:ui-rounded,"SF Pro Rounded","Arial Rounded MT Bold","Trebuchet MS",sans-serif;font-weight:600;letter-spacing:-.01em}
input[type=text],input[type=password],.item,.item small,footer,p.sub,.step,.employer-label{font-family:"Avenir Next",Avenir,"Trebuchet MS","Segoe UI",sans-serif}
input[type=text],input[type=password]{font-weight:500;letter-spacing:0}.item{font-weight:600;letter-spacing:0}.item small{font-weight:400}.step{font-weight:600;letter-spacing:.025em}p.sub{letter-spacing:0}



body,h1,.welcome h1,button,.big,.btn,.purpose-choice,input[type=text],input[type=password],.item,.item small,footer,p.sub,.step,.employer-label,.last,.err{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif}
h1,.welcome h1{font-weight:800;letter-spacing:-.025em}.big,.btn,.purpose-choice{font-weight:750;letter-spacing:0}body,p.sub,.item small,footer{font-weight:500}input[type=text],input[type=password]{font-weight:600}.item,.employer-label,.step{font-weight:700}


/* Native Apple typography, with rounded system family on iPadOS. */
body,h1,.welcome h1,button,.big,.btn,.purpose-choice,input[type=text],input[type=password],.item,.item small,footer,p.sub,.step,.employer-label,.last,.err{font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,.welcome h1{font-weight:700;letter-spacing:-.025em}.big,.btn,.purpose-choice{font-weight:600;letter-spacing:-.01em}body,p.sub,.item small,footer{font-weight:400}input[type=text],input[type=password]{font-weight:500}.item,.employer-label,.step{font-weight:600}


.staff-top-actions{display:flex;align-items:center;justify-content:flex-end;gap:12px;flex-wrap:wrap}
.btn.danger{background:#b42332;color:#fff;border:1px solid #9e1c29;box-shadow:0 4px 12px rgba(180,35,50,.16)}
@media(hover:hover){.btn.danger:hover{background:#981c29;box-shadow:0 6px 16px rgba(180,35,50,.23)}}
.btn.danger:focus-visible{outline-color:#b42332}
@media(prefers-color-scheme:dark){.btn.danger{background:#bd2c3b;color:#fff;border-color:#d74856}}

var CONFIG={school:"Stora Hammars Skola",pin:"7531",retainDays:30,reminderDays:7};
var PURPOSES=["Möte","Föräldramöte","Vikarie","Hantverkare","Annat"];
var KEY="visitor-log-v1",visits=[],form={},view="home",timer=null,idle=null,selected=null,staffTab="active",staffAuth=false;
var $=function(id){return document.getElementById(id)},v=$("v");
function esc(s){var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function p2(n){return String(n).padStart(2,"0")}
function hm(t){var d=new Date(t);return p2(d.getHours())+":"+p2(d.getMinutes())}
function full(t){if(!t)return "";var d=new Date(t);return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+" "+hm(t)}
function note(ok){$("note").textContent=ok?"Dina uppgifter sparas på denna enhet i "+CONFIG.retainDays+" dagar och raderas sedan.":"Uppgifterna kunde inte sparas. Kontakta receptionen."}
function valid(x){return x&&typeof x.name==="string"&&x.name.trim().length>=2&&x.name.length<=100&&typeof x.who==="string"&&x.who.trim().length>=2&&x.who.length<=100&&(x.purpose===undefined||PURPOSES.includes(x.purpose))&&(x.employer===undefined||(typeof x.employer==="string"&&x.employer.length<=100))&&(x.purpose!=="Hantverkare"||(typeof x.employer==="string"&&x.employer.trim().length>=2))&&Number.isFinite(x.inAt)&&x.inAt>0&&x.inAt<=Date.now()&&(!x.outAt||(Number.isFinite(x.outAt)&&x.outAt>=x.inAt&&x.outAt<=Date.now()))}
function save(next){try{localStorage.setItem(KEY,JSON.stringify(next));visits=next;note(true);return true}catch(e){note(false);return false}}
function load(){try{var d=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(d)||!d.every(valid))throw Error();visits=d;note(true)}catch(e){note(false);v.innerHTML='<h1>Besöksloggen kan inte öppnas</h1><p class="sub">Kontakta receptionen. Befintliga uppgifter har inte skrivits över.</p>';return false}return clean()}
function clean(){var cut=Date.now()-CONFIG.retainDays*864e5,next=visits.filter(function(x){return x.inAt>cut});return next.length===visits.length?true:save(next)}
function inside(){return visits.filter(function(x){return !x.outAt})}
function arr(t){return new Date(t).toDateString()===new Date().toDateString()?hm(t):full(t)}
function activity(){clearTimeout(idle);if(view!=="home")idle=setTimeout(function(){form={};selected=null;staffAuth=false;go("home")},60000)}
function go(n){view=n;clearTimeout(timer);if(n==="home"){form={};selected=null;staffAuth=false}render();activity();document.querySelector("main").scrollTop=0}
function dl(name,text,type){var a=document.createElement("a"),url=URL.createObjectURL(new Blob([text],{type:type}));a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);a.remove()},1000)}
function error(){var e=$("e");if(e)e.textContent="Uppgifterna kunde inte sparas. Försök igen eller kontakta receptionen."}
function checkout(x,staff){var next=visits.map(function(y){return y===x?Object.assign({},y,{outAt:Date.now()}):y});if(save(next))go(staff?"staff":"bye");else error()}
function buttons(back,action,label){return '<div class="err" id="e" role="alert"></div><div class="row"><button class="btn" id="b">'+back+'</button>'+(action?'<button class="btn p" id="nx">'+label+'</button>':'')+'</div>'}
function render(){
 if(view==="home"){
 v.innerHTML='<div class="welcome"><img class="sig" src="'+LOGO+'" alt="Skolans logotyp"><div><h1>Välkommen till '+esc(CONFIG.school)+'!</h1><p class="sub">Vänligen registrera dig som besökare nedan.</p></div></div><div class="two"><button class="big p" id="a">Checka in</button><button class="big" id="l">Checka ut</button></div>';
 $("a").onclick=function(){go("name")};$("l").onclick=function(){go("out")};
 }else if(view==="name"||view==="who"){
 var n=view==="name",k=n?"name":"who";
 v.innerHTML='<div class="step">'+(n?1:3)+' av 3</div><h1 id="label">'+(n?'Vad heter du?':'Vem ska du träffa?')+'</h1><p class="sub">'+(n?'Skriv ditt för- och efternamn.':'Skriv namnet på personen du ska besöka.')+'</p><input type="text" id="t" aria-labelledby="label" maxlength="100" autocomplete="off" autocapitalize="words">'+buttons("Tillbaka",true,n?"Nästa":"Checka in");
 $("t").value=form[k]||"";
 $("nx").onclick=function(){var val=$("t").value.trim();if(val.length<2){$("e").textContent="Fyll i "+(n?"ditt namn":"vem du ska träffa")+" för att fortsätta.";return}form[k]=val;if(n)go("purpose");else if(save(visits.concat([{name:form.name,who:form.who,purpose:form.purpose,employer:form.purpose==="Hantverkare"?form.employer:"",inAt:Date.now()}])))go("done");else error()};
 $("t").onkeydown=function(e){if(e.key==="Enter")$("nx").click()};$("b").onclick=function(){form[k]=$("t").value;go(n?"home":"purpose")};
 }else if(view==="purpose"){
 v.innerHTML='<div class="step">2 av 3</div><h1>Vad är syftet med ditt besök?</h1><p class="sub">Välj det som passar ditt besök.</p><div class="purpose-options" role="group" aria-label="Syfte med besöket">'+PURPOSES.map(function(x,i){return '<button type="button" class="btn purpose-choice '+(form.purpose===x?'p':'')+'" aria-pressed="'+(form.purpose===x)+'" data-purpose="'+i+'">'+esc(x)+'</button>'}).join("")+'</div><div id="employer-field" '+(form.purpose==="Hantverkare"?'':'hidden')+'><label for="employer" class="employer-label">Arbetsgivare / företag</label><input type="text" id="employer" maxlength="100" autocomplete="off" placeholder="Skriv arbetsgivarens namn"></div>'+buttons("Tillbaka",true,"Nästa");
